apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cicd-app

spec:
  replicas: 5

  selector:
    matchLabels:
      app: cicd-app

  template:
    metadata:
      labels:
        app: cicd-app
    spec:
      containers:
        - name: cicd-app
          image: reemahmad11/cicd-app:5d74f17bbd254ce396515f55e300dd92149d35a3
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

  strategy:
    canary:
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: cicd-app-analysis

        - pause: {}

        - setWeight: 50
        - analysis:
            templates:
              - templateName: cicd-app-analysis

        - pause: {}

        - setWeight: 100