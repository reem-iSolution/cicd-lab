apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-app-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/reem-iSolution/cicd-lab.git
    targetRevision: part5-environments
    path: gitops/apps/demo-app/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true