name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-app:test .

      - name: Start Docker container
        run: docker run -d --name cicd-test -p 5000:5000 cicd-app:test

      - name: Wait for the application
        run: sleep 5

      - name: Run smoke test
        run: |
          RESPONSE=$(curl --fail http://localhost:5000)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "v1 - hello from CI"

      - name: Show container logs if the test fails
        if: failure()
        run: docker logs cicd-test

      - name: Remove test container
        if: always()
        run: docker rm -f cicd-test